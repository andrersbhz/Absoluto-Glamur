name: Apply Intelligence Session Patch

on:
  push:
    branches:
      - fix/admin-stability-integrations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stability-integrations
          fetch-depth: 0
      - name: Patch intelligence authenticated handlers
        run: python scripts/temp-patch-intelligence-session.py
      - name: Commit functional patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/intelligence.functions.ts
          git commit -m "fix(intelligence): use authenticated catalog session" || exit 0
          git push origin HEAD:fix/admin-stability-integrations
