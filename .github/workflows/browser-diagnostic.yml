name: Browser hydration diagnostic

on:
  push:
    branches: ["agent/browser-hydration-diagnostic"]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render production with real Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found" | tee /tmp/browser-runtime.log
            exit 1
          fi
          echo "Chrome: $CHROME" | tee /tmp/browser-runtime.log

          set +e
          timeout 60s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --virtual-time-budget=15000 \
            --enable-logging=stderr \
            --v=1 \
            --dump-dom \
            https://absolutoglamur.com.br/ \
            >/tmp/browser-dom.html 2>/tmp/chrome-stderr.log
          DUMP_EXIT=$?
          set -e

          echo "dump-dom exit: $DUMP_EXIT" >> /tmp/browser-runtime.log
          echo "dom bytes: $(wc -c </tmp/browser-dom.html 2>/dev/null || echo 0)" >> /tmp/browser-runtime.log
          echo "error page matches: $(grep -c 'Algo não carregou' /tmp/browser-dom.html 2>/dev/null || true)" >> /tmp/browser-runtime.log
          echo "brand matches: $(grep -c 'Absoluto Glamur' /tmp/browser-dom.html 2>/dev/null || true)" >> /tmp/browser-runtime.log
          echo "--- interesting chrome log ---" >> /tmp/browser-runtime.log
          grep -Ei "CONSOLE|Uncaught|TypeError|ReferenceError|SyntaxError|Failed to load|ERR_|exception|error" /tmp/chrome-stderr.log | tail -300 >> /tmp/browser-runtime.log || true

          set +e
          timeout 60s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=15000 \
            --window-size=1365,900 \
            --screenshot=/tmp/browser.png \
            https://absolutoglamur.com.br/ \
            >/tmp/screenshot-stdout.log 2>/tmp/screenshot-stderr.log
          set -e

          if [ ! -s /tmp/browser-dom.html ]; then
            echo "Browser returned an empty DOM" >> /tmp/browser-runtime.log
            exit 1
          fi

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-hydration-diagnostic
          path: |
            /tmp/browser-runtime.log
            /tmp/browser-dom.html
            /tmp/browser.png
            /tmp/chrome-stderr.log
            /tmp/screenshot-stderr.log
            /tmp/screenshot-stdout.log
          if-no-files-found: ignore
          retention-days: 1
