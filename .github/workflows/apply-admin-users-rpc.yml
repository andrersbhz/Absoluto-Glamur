name: Apply Admin Users RPC

on:
  push:
    branches:
      - fix/admin-stability-complete-20260818

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stability-complete-20260818
          fetch-depth: 0
      - run: python scripts/patch-admin-users-rpc.py
      - name: Commit functional change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/admin-system.functions.ts
          git commit -m "fix(admin): manage users through authenticated RPC" || exit 0
          git push origin HEAD:fix/admin-stability-complete-20260818
