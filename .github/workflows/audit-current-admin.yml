name: Audit Remaining Admin Stability

on:
  push:
    branches:
      - fix/admin-stability-integrations

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stability-integrations
          fetch-depth: 0
      - name: Build audit report
        shell: bash
        run: |
          mkdir -p audit
          {
            echo '# Remaining admin stability audit'
            echo
            echo '## service-role usages in server functions'
            grep -RInE 'supabaseAdmin|client\.server' src/lib --include='*.functions.ts' || true
            echo
            echo '## server functions using auth middleware and service-role in same file'
            for f in src/lib/*.functions.ts; do
              if grep -q 'requireSupabaseAuth' "$f" && grep -qE 'supabaseAdmin|client\.server' "$f"; then
                echo "### $f"
                grep -nE 'createServerFn|requireSupabaseAuth|supabaseAdmin|client\.server' "$f" || true
              fi
            done
            echo
            echo '## review validation / direct collection strings'
            grep -RInE 'coleta direta|extens[aã]o|rating.*min\(1\)|min\(1\).*rating|reviews.*rating' src --include='*.ts' --include='*.tsx' || true
            echo
            echo '## authenticated admin route imports'
            grep -RInE 'from "@/lib/|from '\''@/lib/' src/routes/_authenticated/admin* --include='*.ts' --include='*.tsx' || true
          } > audit/current-admin-stability.txt
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/current-admin-stability.txt
          git commit -m "chore: record remaining admin stability audit" || exit 0
          git push origin HEAD:fix/admin-stability-integrations
