name: Apply Importer AI Copy Patch

on:
  push:
    branches:
      - fix/importer-own-ai

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/importer-own-ai
          fetch-depth: 0
      - name: Apply copy patch
        run: python scripts/patch-importer-ai-copy.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/admin.imports.tsx
          git commit -m "fix(importer): remove Lovable AI gateway copy"
          git push origin HEAD:fix/importer-own-ai
