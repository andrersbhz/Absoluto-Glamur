name: Diagnose AliExpress Reviews Production

on:
  push:
    branches:
      - diagnostic/aliexpress-review-production

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trigger product review sync and verify persistence
        shell: bash
        run: |
          set -euo pipefail

          read_env() {
            local pattern="$1"
            grep -E "$pattern" .env | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" -e 's/\r$//'
          }

          SUPABASE_URL=$(read_env '^(VITE_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_URL)=')
          SUPABASE_KEY=$(read_env '^(VITE_SUPABASE_PUBLISHABLE_KEY|VITE_SUPABASE_ANON_KEY|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|NEXT_PUBLIC_SUPABASE_ANON_KEY)=')
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Public Supabase configuration not found in .env"
            exit 1
          fi

          api_get() {
            local path="$1"
            curl --max-time 20 -fsS \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Accept: application/json" \
              "${SUPABASE_URL}/rest/v1/${path}"
          }

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found"
            exit 1
          fi

          : > /tmp/review-diagnostic.log
          echo "Reading production sitemap and selecting slugs with AliExpress-style source IDs..." | tee -a /tmp/review-diagnostic.log
          curl --max-time 20 -fsSL "https://absolutoglamur.com.br/sitemap.xml" -o /tmp/sitemap.xml
          python - <<'PY' > /tmp/product_urls.txt
          import re, xml.etree.ElementTree as ET
          root=ET.parse('/tmp/sitemap.xml').getroot()
          urls=[]
          for node in root.iter():
              if node.tag.endswith('loc') and node.text:
                  url=node.text.strip()
                  if '/products/' in url and re.search(r'(?:100500\d{7,}|\d{12,})', url):
                      urls.append(url)
          for url in urls[:30]:
              print(url)
          PY

          if [ ! -s /tmp/product_urls.txt ]; then
            echo "No AliExpress-style product URLs found in sitemap; falling back to all product URLs" | tee -a /tmp/review-diagnostic.log
            python - <<'PY' > /tmp/product_urls.txt
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/sitemap.xml').getroot()
          urls=[]
          for node in root.iter():
              if node.tag.endswith('loc') and node.text and '/products/' in node.text:
                  urls.append(node.text.strip())
          for url in urls[:30]:
              print(url)
          PY
          fi

          if [ ! -s /tmp/product_urls.txt ]; then
            echo "No product URLs found in production sitemap" | tee -a /tmp/review-diagnostic.log
            exit 1
          fi

          api_get 'product_external_reviews?source=eq.aliexpress&is_visible=eq.true&select=id,product_id,source_review_id,rating&limit=100' > /tmp/global-before.json || echo '[]' > /tmp/global-before.json
          global_before=$(python - <<'PY'
          import json
          print(len(json.load(open('/tmp/global-before.json'))))
          PY
          )
          echo "Official AliExpress reviews publicly visible before test: ${global_before}" | tee -a /tmp/review-diagnostic.log

          success=0
          tested=0
          while read -r product_url; do
            [ "$tested" -ge 10 ] && break
            slug="${product_url##*/}"
            encoded_slug=$(python - "$slug" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
            )
            api_get "products?slug=eq.${encoded_slug}&select=id,slug,name&limit=1" > /tmp/product.json || continue
            product_id=$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/product.json'))
          print((rows[0].get('id') if rows else '') or '')
          PY
            )
            [ -z "$product_id" ] && continue
            tested=$((tested + 1))

            api_get "product_external_reviews?product_id=eq.${product_id}&source=eq.aliexpress&is_visible=eq.true&select=id,source_review_id,rating,author_country,reviewed_at&limit=20" > /tmp/before.json || echo '[]' > /tmp/before.json
            before=$(python - <<'PY'
          import json
          print(len(json.load(open('/tmp/before.json'))))
          PY
            )
            echo "Testing ${product_url}; product_id=${product_id}; official before=${before}" | tee -a /tmp/review-diagnostic.log

            set +e
            timeout 55s "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=30000 \
              --enable-logging=stderr \
              --v=0 \
              --dump-dom \
              "$product_url" \
              > /tmp/product-dom.html 2> /tmp/product-browser-stderr.log
            chrome_exit=$?
            set -e
            echo "Chrome exit=${chrome_exit}; DOM bytes=$(wc -c </tmp/product-dom.html 2>/dev/null || echo 0)" | tee -a /tmp/review-diagnostic.log

            sleep 5
            api_get "product_external_reviews?product_id=eq.${product_id}&source=eq.aliexpress&is_visible=eq.true&select=id,source_review_id,rating,author_country,reviewed_at&limit=20" > /tmp/after.json || echo '[]' > /tmp/after.json
            after=$(python - <<'PY'
          import json
          print(len(json.load(open('/tmp/after.json'))))
          PY
            )
            echo "official after=${after}" | tee -a /tmp/review-diagnostic.log

            if [ "$after" -gt 0 ]; then
              python - <<'PY' | tee -a /tmp/review-diagnostic.log
          import json
          sample=json.load(open('/tmp/after.json'))[0]
          print('Verified official review sample:', {
              'has_source_review_id': bool(sample.get('source_review_id')),
              'rating': sample.get('rating'),
              'author_country': sample.get('author_country'),
              'reviewed_at': sample.get('reviewed_at'),
          })
          PY
              success=1
              break
            fi

            grep -Ei "CONSOLE|TypeError|ReferenceError|Uncaught|Failed to load|ERR_|reviews|AliExpress" /tmp/product-browser-stderr.log | tail -80 >> /tmp/review-diagnostic.log || true
          done < /tmp/product_urls.txt

          api_get 'product_external_reviews?source=eq.aliexpress&is_visible=eq.true&select=id,product_id,source_review_id,rating&limit=100' > /tmp/global-after.json || echo '[]' > /tmp/global-after.json
          global_after=$(python - <<'PY'
          import json
          print(len(json.load(open('/tmp/global-after.json'))))
          PY
          )
          echo "Official AliExpress reviews publicly visible after test: ${global_after}" | tee -a /tmp/review-diagnostic.log

          if [ "$success" -ne 1 ] && [ "$global_after" -le "$global_before" ]; then
            echo "No official AliExpress review was observable after testing ${tested} production products" | tee -a /tmp/review-diagnostic.log
            exit 1
          fi

          echo "Production AliExpress review persistence verified" | tee -a /tmp/review-diagnostic.log
      - name: Upload review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-review-production-diagnostic
          path: |
            /tmp/review-diagnostic.log
            /tmp/product-dom.html
            /tmp/product-browser-stderr.log
            /tmp/before.json
            /tmp/after.json
            /tmp/global-before.json
            /tmp/global-after.json
            /tmp/product_urls.txt
          if-no-files-found: ignore
          retention-days: 1
