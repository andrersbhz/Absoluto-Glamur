name: Fix Integration Verified Status

on:
  push:
    branches:
      - fix/integration-verified-status

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-verified-status
          fetch-depth: 0
      - name: Patch verified/inactive flow
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/lib/integrations.functions.ts')
          s = p.read_text()
          if 'if (!apiKey || row.enabled === false)' not in s:
              raise SystemExit('AI test condition not found')
          s = s.replace('if (!apiKey || row.enabled === false)', 'if (!apiKey)', 1)
          s = s.replace('Preencha a chave da API e ative a integração antes de testar.', 'Preencha a chave da API antes de testar.', 1)
          p.write_text(s)

          p = Path('src/routes/_authenticated/admin.integrations.tsx')
          s = p.read_text()
          needle = '            connected={integration.last_status === "ok" && integration.enabled}\n            errored={integration.last_status === "error"}'
          replacement = '            connected={integration.last_status === "ok" && integration.enabled}\n            verified={integration.last_status === "ok"}\n            errored={integration.last_status === "error"}'
          if needle not in s:
              raise SystemExit('StatusLight invocation not found')
          s = s.replace(needle, replacement, 1)

          needle = 'function StatusLight({\n  connected,\n  errored,'
          replacement = 'function StatusLight({\n  connected,\n  verified,\n  errored,'
          if needle not in s:
              raise SystemExit('StatusLight destructuring not found')
          s = s.replace(needle, replacement, 1)

          needle = '  connected: boolean;\n  errored: boolean;'
          replacement = '  connected: boolean;\n  verified: boolean;\n  errored: boolean;'
          if needle not in s:
              raise SystemExit('StatusLight types not found')
          s = s.replace(needle, replacement, 1)

          needle = '    ? { color: "bg-success", label: "Conectado", pulse: true, title: "Provedor testado e ativo" }\n    : errored'
          replacement = '    ? { color: "bg-success", label: "Conectado", pulse: true, title: "Provedor testado e ativo" }\n    : verified\n      ? { color: "bg-success", label: "Validada", pulse: false, title: "Credencial testada com sucesso; integração ainda está inativa" }\n      : errored'
          if needle not in s:
              raise SystemExit('StatusLight behavior not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
      - name: Commit functional changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/integrations.functions.ts src/routes/_authenticated/admin.integrations.tsx
          git commit -m "fix(integrations): separate validated from active status" || exit 0
          git push origin HEAD:fix/integration-verified-status
