name: Apply Category Single Block

on:
  push:
    branches:
      - fix/home-categories-inline-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-categories-inline-builder
          fetch-depth: 0
      - name: Apply consolidation
        run: python scripts/patch-category-single-block.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/_authenticated/admin.home.tsx
          git commit -m "fix(home): consolidate category strip into one block"
          git push origin HEAD:fix/home-categories-inline-builder
