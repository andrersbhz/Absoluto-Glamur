name: Apply AliExpress URL Official API Patch

on:
  push:
    branches:
      - fix/aliexpress-url-official-api

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aliexpress-url-official-api
          fetch-depth: 0
      - name: Apply URL importer patch
        run: python scripts/patch-aliexpress-url-official.py
      - name: Commit functional changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/aliexpress-import.functions.ts src/routes/_authenticated/admin.imports.tsx
          git commit -m "fix(importer): use official AliExpress API for URL imports"
          git push origin HEAD:fix/aliexpress-url-official-api
