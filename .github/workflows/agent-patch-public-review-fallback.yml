name: Agent Patch Public Review Fallback

on:
  push:
    branches:
      - agent/public-review-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-review-fallback
      - name: Wire public review fallback
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/lib/product-reviews-live.functions.ts')
          s = p.read_text()

          import_line = 'import { generateWithOwnKeys } from "./ai-translate.server";\n'
          public_import = 'import { fetchAliExpressPublicReviews } from "./aliexpress-public-reviews.server";\n'
          if public_import not in s:
              if import_line not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(import_line, import_line + public_import, 1)

          anchor = '''  } catch (error) {
            officialError = (error instanceof Error ? error.message : String(error)).slice(0, 1200);
          }

          try {
            // Fallback: o Dropshipper expõe somente nota média e quantidade. Ele não
'''
          if anchor not in s:
              raise SystemExit('sync anchor not found')

          public_block = '''  } catch (error) {
            officialError = (error instanceof Error ? error.message : String(error)).slice(0, 1200);
          }

          let publicError: string | null = null;

          // Segundo caminho: coleta best-effort da página pública. Não usa credenciais,
          // não contorna CAPTCHA e só persiste comentários realmente expostos pelo
          // próprio AliExpress em HTML/JSON público.
          try {
            const publicResult = await fetchAliExpressPublicReviews(sourceId);
            if (publicResult.reviews.length > 0) {
              const persisted = await persistOfficialReviews(admin, productId, publicResult.reviews);
              const translatedNow = await translatePendingReviews(admin, productId, 36);

              let aggregateUpdated = false;
              let remoteTotal: number | null = publicResult.reviews.length;
              let remoteAverage: number | null = publicResult.reviews.length
                ? Math.round((publicResult.reviews.reduce((sum, review) => sum + review.rating, 0) / publicResult.reviews.length) * 100) / 100
                : null;

              // Mantemos a nota/quantidade oficial do Dropshipper quando disponível,
              // mas uma falha no agregado nunca apaga os comentários públicos obtidos.
              try {
                const aggregate = await fetchDropshipperReviewAggregate(sourceId, credentialClient);
                const hasAggregate = (aggregate.total ?? 0) > 0 || (aggregate.average ?? 0) > 0;
                if (hasAggregate) {
                  aggregateUpdated = await persistDropshipperReviewAggregate(admin, productId, aggregate);
                  if ((aggregate.total ?? 0) > 0) remoteTotal = aggregate.total;
                  if ((aggregate.average ?? 0) > 0) remoteAverage = aggregate.average;
                }
              } catch {
                // Comentários públicos já obtidos; agregado é complementar.
              }

              const finishedAt = new Date().toISOString();
              await admin.from("product_review_sync_state").upsert({
                product_id: productId,
                source: "aliexpress_public",
                source_id: publicResult.productId,
                status: "ok",
                fetched_count: publicResult.reviews.length,
                remote_total: remoteTotal,
                last_attempt_at: now,
                last_success_at: finishedAt,
                last_error: null,
                updated_at: finishedAt,
              }, { onConflict: "product_id" });

              return {
                fetched: publicResult.reviews.length,
                upserted: persisted.upserted,
                translated: translatedBacklog + translatedNow,
                skipped: false,
                source: "public_page_reviews" as const,
                error: null,
                aggregateUpdated,
                remoteTotal,
                remoteAverage,
              };
            }

            const diagnostic = publicResult.diagnostics.filter(Boolean).join(" | ");
            publicError = diagnostic
              ? `Coleta pública do AliExpress: ${diagnostic}`.slice(0, 1200)
              : "A página pública do AliExpress não expôs comentários para este produto.";
          } catch (error) {
            publicError = `Coleta pública do AliExpress: ${error instanceof Error ? error.message : String(error)}`.slice(0, 1200);
          }

          try {
            // Último fallback: o Dropshipper expõe somente nota média e quantidade. Ele não
'''
          s = s.replace(anchor, public_block, 1)

          old_last_error = '      last_error: officialError,\n'
          new_last_error = '      last_error: [officialError, publicError].filter(Boolean).join(" | ").slice(0, 1200) || null,\n'
          if old_last_error not in s:
              raise SystemExit('last_error anchor not found')
          s = s.replace(old_last_error, new_last_error, 1)

          old_return_error = '''      // Se a TOP falhou, o administrador recebe o motivo real. Assim falta/erro
            // de credencial não aparece mais como "AliExpress não retornou avaliações".
            error: officialError,
'''
          new_return_error = '''      // Se TOP e coleta pública não trouxeram comentários, o administrador recebe
            // o diagnóstico real; o agregado continua útil apenas para nota/quantidade.
            error: [officialError, publicError].filter(Boolean).join(" | ").slice(0, 1200) || null,
'''
          if old_return_error not in s:
              raise SystemExit('return error anchor not found')
          s = s.replace(old_return_error, new_return_error, 1)

          old_catch = '''    const aggregateError = (error instanceof Error ? error.message : String(error)).slice(0, 1200);
            const message = officialError
              ? `${officialError} | Fallback Dropshipper: ${aggregateError}`.slice(0, 1200)
              : aggregateError;
'''
          new_catch = '''    const aggregateError = (error instanceof Error ? error.message : String(error)).slice(0, 1200);
            const previous = [officialError, publicError].filter(Boolean).join(" | ");
            const message = previous
              ? `${previous} | Fallback Dropshipper: ${aggregateError}`.slice(0, 1200)
              : aggregateError;
'''
          if old_catch not in s:
              raise SystemExit('aggregate catch anchor not found')
          s = s.replace(old_catch, new_catch, 1)

          p.write_text(s)
      - name: Run public review parser tests
        run: bun scripts/test-aliexpress-public-reviews.ts
      - name: Run live public fetch smoke
        run: bun scripts/test-aliexpress-public-reviews.ts --live
      - name: Commit patch
        run: |
          git config user.name "André Rocha"
          git config user.email "andrers.bhz@gmail.com"
          git add src/lib/product-reviews-live.functions.ts
          git commit -m "feat: usar página pública como fallback de avaliações"
          git push origin agent/public-review-fallback
