name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint (diagnostic)
        run: bun run lint
        continue-on-error: true
      - name: Build (required)
        run: bun run build
      - name: Home smoke test (required)
        shell: bash
        run: |
          set -euo pipefail
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/home.html; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Home did not become available"
            cat /tmp/preview.log || true
            exit 1
          fi

          test -s /tmp/home.html
          grep -q "Absoluto Glamur" /tmp/home.html
          if grep -q "Algo não carregou" /tmp/home.html; then
            echo "Root error page detected in Home response"
            exit 1
          fi

          echo "Home smoke test passed"
