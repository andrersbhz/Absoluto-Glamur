name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint (diagnostic)
        run: bun run lint
        continue-on-error: true
      - name: Build (required)
        run: bun run build
      - name: Storefront + Blog SSR smoke test (required)
        shell: bash
        run: |
          set -euo pipefail
          bun run dev > /tmp/dev-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ok=0
          HOME_URL=""
          : > /tmp/listeners.txt
          for i in $(seq 1 60); do
            ss -ltnp > /tmp/listeners.txt 2>&1 || true
            ports=$(ss -ltnH 2>/dev/null | awk '{addr=$4; sub(/^.*:/,"",addr); if (addr ~ /^[0-9]+$/) print addr}' | sort -nu)
            for port in $ports; do
              for host in 127.0.0.1 localhost; do
                url="http://${host}:${port}/"
                if curl --max-time 2 -fsS "$url" -o /tmp/candidate.html 2>/dev/null; then
                  if grep -q "Absoluto Glamur" /tmp/candidate.html; then
                    cp /tmp/candidate.html /tmp/home.html
                    HOME_URL="$url"
                    ok=1
                    break 3
                  fi
                fi
              done
            done
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "SSR dev server exited before Home became available"
              cat /tmp/dev-server.log || true
              exit 1
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Could not locate a healthy Home endpoint"
            echo "--- listeners ---"
            cat /tmp/listeners.txt || true
            echo "--- server log ---"
            cat /tmp/dev-server.log || true
            exit 1
          fi

          BASE_URL="${HOME_URL%/}"
          echo "Testing storefront SSR at ${BASE_URL}"
          test -s /tmp/home.html
          ! grep -q "Algo não carregou" /tmp/home.html
          grep -q "Absoluto Glamur" /tmp/home.html

          echo "Testing Blog SSR"
          curl --max-time 10 -fsS "${BASE_URL}/blog" -o /tmp/blog.html
          ! grep -q "Algo não carregou" /tmp/blog.html
          grep -Eq "Conteúdo Absoluto Glamur|Beleza com informação|Blog de beleza" /tmp/blog.html

          echo "Testing Blog RSS"
          curl --max-time 10 -fsS "${BASE_URL}/blog/feed.xml" -o /tmp/blog-feed.xml
          grep -q '<rss' /tmp/blog-feed.xml
          grep -q '<channel>' /tmp/blog-feed.xml

          echo "Testing sitemap"
          curl --max-time 10 -fsS "${BASE_URL}/sitemap.xml" -o /tmp/sitemap.xml
          grep -q '<urlset' /tmp/sitemap.xml
          grep -q '/blog' /tmp/sitemap.xml

          echo "Storefront + Blog SSR smoke tests passed"
      - name: Upload SSR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics
          path: |
            /tmp/dev-server.log
            /tmp/listeners.txt
            /tmp/home.html
            /tmp/blog.html
            /tmp/blog-feed.xml
            /tmp/sitemap.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Production storefront + Blog HTTP check
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          check_html() {
            local url="$1"
            local output="$2"
            local pattern="$3"
            local label="$4"
            local healthy=0
            for i in $(seq 1 18); do
              code=$(curl --max-time 12 -sS -L -o "$output" -w '%{http_code}' "$url" || true)
              echo "${label} attempt ${i}: HTTP ${code}"
              if [ "$code" = "200" ] && grep -Eq "$pattern" "$output" && ! grep -q "Algo não carregou" "$output"; then
                healthy=1
                break
              fi
              sleep 10
            done
            if [ "$healthy" -ne 1 ]; then
              echo "${label} failed: ${url}"
              head -c 1200 "$output" 2>/dev/null || true
              exit 1
            fi
          }

          check_xml() {
            local url="$1"
            local output="$2"
            local pattern="$3"
            local label="$4"
            local healthy=0
            for i in $(seq 1 12); do
              code=$(curl --max-time 12 -sS -L -o "$output" -w '%{http_code}' "$url" || true)
              echo "${label} attempt ${i}: HTTP ${code}"
              if [ "$code" = "200" ] && grep -q "$pattern" "$output"; then
                healthy=1
                break
              fi
              sleep 10
            done
            if [ "$healthy" -ne 1 ]; then
              echo "${label} failed: ${url}"
              head -c 1200 "$output" 2>/dev/null || true
              exit 1
            fi
          }

          check_html "https://absolutoglamur.com.br/" /tmp/production-home.html "Absoluto Glamur" "Home"
          check_html "https://absolutoglamur.com.br/blog" /tmp/production-blog.html "Conteúdo Absoluto Glamur|Beleza com informação|Blog de beleza" "Blog"
          check_xml "https://absolutoglamur.com.br/blog/feed.xml" /tmp/production-blog-feed.xml '<rss' "Blog RSS"
          check_xml "https://absolutoglamur.com.br/sitemap.xml" /tmp/production-sitemap.xml '<urlset' "Sitemap"
          grep -q '/blog' /tmp/production-sitemap.xml
          echo "Production storefront + Blog HTTP checks passed"
      - name: Production browser hydration check
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi

          browser_check() {
            local url="$1"
            local output="$2"
            local stderr_file="$3"
            local expected="$4"
            local label="$5"
            local healthy=0
            for i in $(seq 1 12); do
              echo "${label} browser attempt ${i}" | tee -a /tmp/production-browser.log
              set +e
              timeout 45s "$CHROME" \
                --headless=new \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --virtual-time-budget=12000 \
                --enable-logging=stderr \
                --v=0 \
                --dump-dom \
                "$url" \
                >"$output" 2>"$stderr_file"
              chrome_exit=$?
              set -e

              echo "${label}: Chrome exit ${chrome_exit}; DOM bytes $(wc -c <"$output" 2>/dev/null || echo 0)" | tee -a /tmp/production-browser.log
              if [ -s "$output" ] \
                && grep -Eq "$expected" "$output" \
                && ! grep -q "Algo não carregou" "$output" \
                && ! grep -q "Missing Supabase environment variable" "$output"; then
                healthy=1
                break
              fi

              grep -Ei "CONSOLE|Missing Supabase|TypeError|ReferenceError|Uncaught|Failed to load|ERR_" "$stderr_file" | tail -80 >> /tmp/production-browser.log || true
              sleep 10
            done

            if [ "$healthy" -ne 1 ]; then
              echo "${label} fails after browser hydration"
              grep -o "Algo não carregou\|Missing Supabase environment variable[^<]*\|Absoluto Glamur" "$output" | head -30 || true
              cat /tmp/production-browser.log || true
              exit 1
            fi
          }

          : > /tmp/production-browser.log
          browser_check \
            "https://absolutoglamur.com.br/" \
            /tmp/production-browser.html \
            /tmp/production-browser-stderr.log \
            "Absoluto Glamur" \
            "Home"
          browser_check \
            "https://absolutoglamur.com.br/blog" \
            /tmp/production-blog-browser.html \
            /tmp/production-blog-browser-stderr.log \
            "Conteúdo Absoluto Glamur|Beleza com informação|Blog de beleza" \
            "Blog"
          echo "Production browser hydration checks passed"
      - name: Upload production diagnostics
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-health
          path: |
            /tmp/production-home.html
            /tmp/production-blog.html
            /tmp/production-blog-feed.xml
            /tmp/production-sitemap.xml
            /tmp/production-browser.html
            /tmp/production-blog-browser.html
            /tmp/production-browser.log
            /tmp/production-browser-stderr.log
            /tmp/production-blog-browser-stderr.log
          if-no-files-found: ignore
          retention-days: 1
