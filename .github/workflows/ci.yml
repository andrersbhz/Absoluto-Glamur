name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint (diagnostic)
        run: bun run lint
        continue-on-error: true
      - name: Build (required)
        run: bun run build
      - name: Home SSR smoke test (required)
        shell: bash
        run: |
          set -euo pipefail
          bun run dev > /tmp/dev-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ok=0
          HOME_URL=""
          : > /tmp/listeners.txt
          for i in $(seq 1 60); do
            ss -ltnp > /tmp/listeners.txt 2>&1 || true
            ports=$(ss -ltnH 2>/dev/null | awk '{addr=$4; sub(/^.*:/,"",addr); if (addr ~ /^[0-9]+$/) print addr}' | sort -nu)
            for port in $ports; do
              for host in 127.0.0.1 localhost; do
                url="http://${host}:${port}/"
                if curl --max-time 2 -fsS "$url" -o /tmp/candidate.html 2>/dev/null; then
                  if grep -q "Absoluto Glamur" /tmp/candidate.html; then
                    cp /tmp/candidate.html /tmp/home.html
                    HOME_URL="$url"
                    ok=1
                    break 3
                  fi
                fi
              done
            done
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "SSR dev server exited before Home became available"
              cat /tmp/dev-server.log || true
              exit 1
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Could not locate a healthy Home endpoint"
            echo "--- listeners ---"
            cat /tmp/listeners.txt || true
            echo "--- server log ---"
            cat /tmp/dev-server.log || true
            exit 1
          fi

          echo "Testing ${HOME_URL}"
          test -s /tmp/home.html
          if grep -q "Algo não carregou" /tmp/home.html; then
            echo "Root error page detected in Home response"
            cat /tmp/dev-server.log || true
            exit 1
          fi
          grep -q "Absoluto Glamur" /tmp/home.html
          echo "Home SSR smoke test passed"
      - name: Upload SSR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics
          path: |
            /tmp/dev-server.log
            /tmp/listeners.txt
            /tmp/home.html
          if-no-files-found: ignore
          retention-days: 1
      - name: Production domain HTTP check
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 18); do
            code=$(curl --max-time 10 -sS -L -o /tmp/production-home.html -w '%{http_code}' https://absolutoglamur.com.br/ || true)
            echo "production HTTP attempt ${i}: HTTP ${code}"
            if [ "$code" = "200" ] && grep -q "Absoluto Glamur" /tmp/production-home.html; then
              healthy=1
              break
            fi
            sleep 10
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Production domain is not returning storefront HTML"
            exit 1
          fi
      - name: Production browser hydration check
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi

          healthy=0
          : > /tmp/production-browser.log
          for i in $(seq 1 12); do
            echo "browser attempt ${i}" | tee -a /tmp/production-browser.log
            set +e
            timeout 45s "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=12000 \
              --enable-logging=stderr \
              --v=0 \
              --dump-dom \
              https://absolutoglamur.com.br/ \
              >/tmp/production-browser.html 2>/tmp/production-browser-stderr.log
            chrome_exit=$?
            set -e

            echo "Chrome exit ${chrome_exit}; DOM bytes $(wc -c </tmp/production-browser.html 2>/dev/null || echo 0)" | tee -a /tmp/production-browser.log

            if [ -s /tmp/production-browser.html ] \
              && grep -q "Absoluto Glamur" /tmp/production-browser.html \
              && ! grep -q "Algo não carregou" /tmp/production-browser.html \
              && ! grep -q "Missing Supabase environment variable" /tmp/production-browser.html; then
              healthy=1
              break
            fi

            grep -Ei "CONSOLE|Missing Supabase|TypeError|ReferenceError|Uncaught|Failed to load|ERR_" /tmp/production-browser-stderr.log | tail -80 >> /tmp/production-browser.log || true
            sleep 10
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Production storefront fails after browser hydration"
            grep -o "Algo não carregou\|Missing Supabase environment variable[^<]*\|Absoluto Glamur" /tmp/production-browser.html | head -30 || true
            cat /tmp/production-browser.log || true
            exit 1
          fi
          echo "Production browser hydration check passed"
      - name: Upload production diagnostics
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-health
          path: |
            /tmp/production-home.html
            /tmp/production-browser.html
            /tmp/production-browser.log
            /tmp/production-browser-stderr.log
          if-no-files-found: ignore
          retention-days: 1
