name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint (diagnostic)
        run: bun run lint
        continue-on-error: true
      - name: Build (required)
        run: bun run build
      - name: Home SSR smoke test (required)
        shell: bash
        run: |
          set -euo pipefail
          bun run dev > /tmp/dev-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ok=0
          HOME_URL=""
          for i in $(seq 1 60); do
            for port in 5173 8080 4173; do
              if curl -fsS "http://127.0.0.1:${port}/" -o /tmp/home.html 2>/dev/null; then
                HOME_URL="http://127.0.0.1:${port}/"
                ok=1
                break 2
              fi
            done
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "SSR dev server exited before Home became available"
              cat /tmp/dev-server.log || true
              exit 1
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Home did not become available on expected Vite/TanStack ports"
            cat /tmp/dev-server.log || true
            exit 1
          fi

          echo "Testing ${HOME_URL}"
          test -s /tmp/home.html
          grep -q "Absoluto Glamur" /tmp/home.html
          if grep -q "Algo não carregou" /tmp/home.html; then
            echo "Root error page detected in Home response"
            cat /tmp/dev-server.log || true
            exit 1
          fi

          echo "Home SSR smoke test passed"
