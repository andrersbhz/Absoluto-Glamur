name: Apply Review Auto Sync

on:
  push:
    branches:
      - fix/aliexpress-reviews-official-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aliexpress-reviews-official-sync
          fetch-depth: 0
      - run: python scripts/patch-review-auto-sync-on-load.py
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/store/ProductReviews.tsx
          git commit -m "fix(reviews): sync product reviews in background on page load"
          git push origin HEAD:fix/aliexpress-reviews-official-sync
