name: Apply Importer Admin Session Patch

on:
  push:
    branches:
      - fix/admin-stability-integrations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stability-integrations
          fetch-depth: 0
      - name: Apply importer patch
        run: python scripts/patch-import-admin-session.py
      - name: Commit importer changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/aliexpress-import.functions.ts
          git commit -m "fix(importer): use authenticated admin session across all tabs" || exit 0
          git push origin HEAD:fix/admin-stability-integrations
