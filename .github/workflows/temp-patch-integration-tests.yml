name: Apply Truthful Integration Tests Patch

on:
  push:
    branches:
      - fix/integration-test-truth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-test-truth
          fetch-depth: 0
      - name: Patch integration tests and UI
        run: python scripts/temp-patch-integration-tests.py
      - name: Commit functional changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/integrations.functions.ts src/routes/_authenticated/admin.integrations.tsx
          git commit -m "fix(integrations): validate real connections without false positives" || exit 0
          git push origin HEAD:fix/integration-test-truth
