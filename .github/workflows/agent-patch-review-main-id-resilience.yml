name: Agent Patch Review Main ID Resilience

on:
  push:
    branches:
      - agent/reviews-main-product-id-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviews-main-product-id-fallback
      - name: Make main-product retry best effort
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/product-reviews-live.functions.ts')
          s = p.read_text()
          old = '''  if (first.mainProductId && first.mainProductId !== productId) {\n    const mainPayload = await fetchDropshipperProductPayload(first.mainProductId, credentialClient);\n    const main = parseDropshipperReviewAggregate(mainPayload, first.mainProductId);\n    const mainHasReviews = (main.total ?? 0) > 0 || (main.average ?? 0) > 0;\n    if (mainHasReviews) return main;\n  }\n'''
          new = '''  if (first.mainProductId && first.mainProductId !== productId) {\n    try {\n      const mainPayload = await fetchDropshipperProductPayload(first.mainProductId, credentialClient);\n      const main = parseDropshipperReviewAggregate(mainPayload, first.mainProductId);\n      const mainHasReviews = (main.total ?? 0) > 0 || (main.average ?? 0) > 0;\n      if (mainHasReviews) return main;\n    } catch {\n      // O retry no produto principal é apenas um fallback. Se ele estiver\n      // indisponível/restrito temporariamente, preservamos o resultado regional\n      // vazio em vez de transformar a sincronização inteira em erro.\n    }\n  }\n'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new))
      - name: Commit patch
        run: |
          git config user.name "André Rocha"
          git config user.email "andrers.bhz@gmail.com"
          git add src/lib/product-reviews-live.functions.ts
          git commit -m "fix: preservar resultado regional se fallback falhar"
          git push origin agent/reviews-main-product-id-fallback
