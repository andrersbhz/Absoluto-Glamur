name: Apply Own Credentials Runtime

on:
  push:
    branches:
      - fix/admin-stability-complete-20260818

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stability-complete-20260818
          fetch-depth: 0
      - name: Apply own-credentials patch
        run: python scripts/remove-lovable-runtime-20260818.py
      - name: Commit functional changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/ai-content.functions.ts \
            src/lib/aliexpress-discovery.functions.ts \
            src/lib/aliexpress-import.functions.ts \
            src/lib/product-reviews-live.functions.ts \
            src/lib/aliexpress-direct-review-import.functions.ts
          git commit -m "fix: use merchant AI and Firecrawl credentials only" || exit 0
          git push origin HEAD:fix/admin-stability-complete-20260818
