name: Agent Patch Review Zero

on:
  push:
    branches:
      - agent/reviews-zero-no-false-success

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviews-zero-no-false-success
          fetch-depth: 0

      - name: Patch zero-review handling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          lib_path = Path('src/lib/product-reviews-live.functions.ts')
          lib = lib_path.read_text()

          old_persist = '''async function persistDropshipperReviewAggregate(\n  admin: any,\n  productId: string,\n  aggregate: DropshipperReviewAggregate,\n): Promise<boolean> {\n  const patch: Record<string, number> = {};\n  if (aggregate.average != null) patch.rating_avg = aggregate.average;\n  if (aggregate.total != null) patch.rating_count = aggregate.total;\n  if (!Object.keys(patch).length) return false;\n\n  const { error } = await admin.from("products").update(patch).eq("id", productId);\n  if (error) throw new Error(`Falha ao atualizar a nota oficial do produto: ${error.message}`);\n  return true;\n}\n'''
          new_persist = '''async function persistDropshipperReviewAggregate(\n  admin: any,\n  productId: string,\n  aggregate: DropshipperReviewAggregate,\n): Promise<boolean> {\n  // Zero/zero significa que a API não trouxe uma avaliação útil para este item.\n  // Nunca usamos esse retorno para apagar uma nota/contagem válida já existente.\n  const hasAverage = aggregate.average != null && aggregate.average > 0;\n  const hasTotal = aggregate.total != null && aggregate.total > 0;\n  if (!hasAverage && !hasTotal) return false;\n\n  const { data: current, error: readError } = await admin\n    .from("products")\n    .select("rating_avg,rating_count")\n    .eq("id", productId)\n    .maybeSingle();\n  if (readError) throw new Error(`Falha ao ler a nota atual do produto: ${readError.message}`);\n\n  const patch: Record<string, number> = {};\n  if (hasAverage && Number(current?.rating_avg ?? 0) !== aggregate.average) patch.rating_avg = aggregate.average as number;\n  if (hasTotal && Number(current?.rating_count ?? 0) !== aggregate.total) patch.rating_count = aggregate.total as number;\n  if (!Object.keys(patch).length) return false;\n\n  const { error } = await admin.from("products").update(patch).eq("id", productId);\n  if (error) throw new Error(`Falha ao atualizar a nota oficial do produto: ${error.message}`);\n  return true;\n}\n'''
          if old_persist not in lib:
              raise SystemExit('persist block not found')
          lib = lib.replace(old_persist, new_persist, 1)

          old_sync = '''    const aggregate = await fetchDropshipperReviewAggregate(sourceId, credentialClient);\n    const aggregateUpdated = await persistDropshipperReviewAggregate(admin, productId, aggregate);\n    const finishedAt = new Date().toISOString();\n    const status = (aggregate.total ?? 0) > 0 || (aggregate.average ?? 0) > 0 ? "ok" : "empty";'''
          new_sync = '''    const aggregate = await fetchDropshipperReviewAggregate(sourceId, credentialClient);\n    const hasRemoteReviews = (aggregate.total ?? 0) > 0 || (aggregate.average ?? 0) > 0;\n    const aggregateUpdated = hasRemoteReviews\n      ? await persistDropshipperReviewAggregate(admin, productId, aggregate)\n      : false;\n    const finishedAt = new Date().toISOString();\n    const status = hasRemoteReviews ? "ok" : "empty";'''
          if old_sync not in lib:
              raise SystemExit('sync aggregate block not found')
          lib = lib.replace(old_sync, new_sync, 1)
          lib_path.write_text(lib)

          ui_path = Path('src/components/store/ProductReviews.tsx')
          ui = ui_path.read_text()
          old_handle = '''      if (result.aggregateUpdated) {\n        const rating = result.remoteAverage != null ? `${result.remoteAverage.toFixed(1)}/5` : null;\n        const total = result.remoteTotal != null ? `${result.remoteTotal} avaliações` : null;\n        const details = [rating, total].filter(Boolean).join(" · ");\n        toast.success(`Dados oficiais do AliExpress atualizados${details ? `: ${details}` : "."}`);\n      } else if ((result.upserted ?? 0) > 0) {\n        toast.success(`${result.upserted} avaliações sincronizadas do AliExpress.`);\n      } else if (result.error) {\n        toast.error(result.error);\n      } else {\n        toast.info("Os dados de avaliação do AliExpress já estão atualizados.");\n      }'''
          new_handle = '''      const hasRemoteReviews = (result.remoteTotal ?? 0) > 0 || (result.remoteAverage ?? 0) > 0;\n      if (result.aggregateUpdated && hasRemoteReviews) {\n        const rating = (result.remoteAverage ?? 0) > 0 ? `${result.remoteAverage!.toFixed(1)}/5` : null;\n        const total = (result.remoteTotal ?? 0) > 0 ? `${result.remoteTotal} avaliações` : null;\n        const details = [rating, total].filter(Boolean).join(" · ");\n        toast.success(`Dados oficiais do AliExpress atualizados${details ? `: ${details}` : "."}`);\n      } else if ((result.upserted ?? 0) > 0) {\n        toast.success(`${result.upserted} avaliações sincronizadas do AliExpress.`);\n      } else if (result.error) {\n        toast.error(result.error);\n      } else if (result.source === "dropshipper_aggregate" && !hasRemoteReviews) {\n        toast.info("O AliExpress não retornou avaliações para este produto. Nenhuma nota existente foi alterada.");\n      } else {\n        toast.info("Os dados de avaliação do AliExpress já estão atualizados.");\n      }'''
          if old_handle not in ui:
              raise SystemExit('UI sync block not found')
          ui = ui.replace(old_handle, new_handle, 1)
          ui_path.write_text(ui)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/product-reviews-live.functions.ts src/components/store/ProductReviews.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: não tratar zero avaliações como sucesso"
          git push origin HEAD:agent/reviews-zero-no-false-success
