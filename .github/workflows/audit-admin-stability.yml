name: Audit Admin Stability

on:
  push:
    branches:
      - fix/admin-stability-integrations

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stability-integrations
          fetch-depth: 0
      - name: Build service-role audit
        shell: bash
        run: |
          mkdir -p audit
          {
            echo '# Authenticated/server-role usage audit'
            echo
            echo '## Imports of client.server / supabaseAdmin under src/lib'
            grep -RInE 'client\.server|supabaseAdmin' src/lib --include='*.functions.ts' || true
            echo
            echo '## Imports of client.server / supabaseAdmin under authenticated routes/components'
            grep -RInE 'client\.server|supabaseAdmin' src/routes/_authenticated src/components/admin --include='*.ts' --include='*.tsx' || true
            echo
            echo '## All client.server / supabaseAdmin usages'
            grep -RInE 'client\.server|supabaseAdmin' src --include='*.ts' --include='*.tsx' || true
          } > audit/service-role-usage.txt
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/service-role-usage.txt
          git commit -m "chore: record admin service-role audit" || exit 0
          git push origin HEAD:fix/admin-stability-integrations
