name: Apply Admin Session DB Patch

on:
  push:
    branches:
      - fix/full-system-stability-integrations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-system-stability-integrations
          fetch-depth: 0
      - name: Apply authenticated DB patch
        run: python scripts/patch-admin-session-db.py
      - name: Commit functional changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/admin-catalog.functions.ts src/lib/dashboard.functions.ts src/lib/blog-admin.functions.ts
          git commit -m "fix: use authenticated DB in admin modules"
          git push origin HEAD:fix/full-system-stability-integrations
