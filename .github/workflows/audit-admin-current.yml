name: Audit Current Admin and Reviews

on:
  push:
    branches:
      - fix/admin-stability-complete-20260818

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stability-complete-20260818
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build audit report and validate
        shell: bash
        run: |
          mkdir -p audit
          {
            echo '# Current admin/reviews audit'
            echo
            echo '## Lovable runtime/AI references'
            grep -RInE 'LOVABLE_API_KEY|createLovableAiGatewayProvider|lovable.*gateway|Lovable.*Gateway' src --include='*.ts' --include='*.tsx' || true
            echo
            echo '## Remaining service-role usages in src/lib'
            grep -RInE 'supabaseAdmin|client\.server' src/lib --include='*.ts' --include='*.tsx' || true
            echo
            echo '## Authenticated functions that still reference service-role'
            for f in src/lib/*.functions.ts; do
              if grep -q 'requireSupabaseAuth' "$f" && grep -qE 'supabaseAdmin|client\.server' "$f"; then
                echo "### $f"
                grep -nE 'createServerFn|requireSupabaseAuth|supabaseAdmin|client\.server' "$f" || true
              fi
            done
            echo
            echo '## Review rating schemas and collection messages'
            grep -RInE 'rating|reviews|coleta direta|coment[aá]rios|extens[aã]o' src --include='*.ts' --include='*.tsx' | grep -E 'min\(|z\.array|coleta direta|extens[aã]o|rating' || true
            echo
            echo '## Review fix assertions'
            grep -n 'rating: z.coerce.number().min(0).max(5).default(0)' src/lib/aliexpress-browser-review-auth.functions.ts || true
            grep -n 'skippedInvalid' src/lib/aliexpress-browser-review-auth.functions.ts src/routes/api/public/aliexpress-review-browser.ts src/components/store/AliExpressReviewSyncBridge.tsx || true
            echo
            echo '## Admin route imports'
            grep -RInE 'from ["'\'' ]@/lib/' src/routes/_authenticated --include='*.ts' --include='*.tsx' || true
          } > audit/current-admin-review-audit.txt

          set +e
          bun install --frozen-lockfile > /tmp/bun-install.log 2>&1
          install_code=$?
          bun run lint > /tmp/lint.log 2>&1
          lint_code=$?
          bun run build > /tmp/build.log 2>&1
          build_code=$?
          set -e

          {
            echo
            echo '## Validation'
            echo "bun install exit: ${install_code}"
            echo "lint exit: ${lint_code}"
            echo "build exit: ${build_code}"
            if [ "$lint_code" -ne 0 ]; then
              echo
              echo '### lint tail'
              tail -80 /tmp/lint.log || true
            fi
            if [ "$build_code" -ne 0 ]; then
              echo
              echo '### build tail'
              tail -120 /tmp/build.log || true
            fi
          } >> audit/current-admin-review-audit.txt

          if [ "$install_code" -ne 0 ] || [ "$build_code" -ne 0 ]; then
            echo 'required validation failed; report will still be committed'
          fi
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/current-admin-review-audit.txt
          git commit -m "chore: record final admin/review audit" || exit 0
          git push origin HEAD:fix/admin-stability-complete-20260818
