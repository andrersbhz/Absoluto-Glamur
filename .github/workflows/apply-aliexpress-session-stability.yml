name: Apply AliExpress Session Stability

on:
  push:
    branches:
      - fix/full-system-stability-integrations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-system-stability-integrations
          fetch-depth: 0
      - run: python scripts/patch-aliexpress-session-stability.py
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/aliexpress-import.functions.ts src/lib/aliexpress-stock.functions.ts src/lib/product-reviews-live.functions.ts
          git commit -m "fix: remove service-role dependency from AliExpress admin flows"
          git push origin HEAD:fix/full-system-stability-integrations
