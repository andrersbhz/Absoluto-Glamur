name: Format Stability Scope

on:
  push:
    branches:
      - fix/admin-stability-complete-20260818

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stability-complete-20260818
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed runtime and extension files
        shell: bash
        run: |
          bunx prettier --write \
            src/components/store/AliExpressReviewSyncBridge.tsx \
            src/lib/ai-content.functions.ts \
            src/lib/aliexpress-browser-review-auth.functions.ts \
            src/lib/aliexpress-browser-review-import.functions.ts \
            src/lib/aliexpress-direct-review-import.functions.ts \
            src/lib/aliexpress-discovery.functions.ts \
            src/lib/aliexpress-import.functions.ts \
            src/lib/product-reviews-live.functions.ts \
            src/routes/api/public/aliexpress-review-browser.ts \
            'tools/aliexpress-review-importer-extension/*.js'
      - name: Commit formatting only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/store/AliExpressReviewSyncBridge.tsx \
            src/lib/ai-content.functions.ts \
            src/lib/aliexpress-browser-review-auth.functions.ts \
            src/lib/aliexpress-browser-review-import.functions.ts \
            src/lib/aliexpress-direct-review-import.functions.ts \
            src/lib/aliexpress-discovery.functions.ts \
            src/lib/aliexpress-import.functions.ts \
            src/lib/product-reviews-live.functions.ts \
            src/routes/api/public/aliexpress-review-browser.ts \
            tools/aliexpress-review-importer-extension
          git commit -m "style: format stability and review sync scope" || exit 0
          git push origin HEAD:fix/admin-stability-complete-20260818
