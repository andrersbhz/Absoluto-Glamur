name: Apply Admin System Fallback Patch

on:
  push:
    branches:
      - fix/full-system-stability-integrations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-system-stability-integrations
          fetch-depth: 0
      - run: python scripts/patch-admin-system-fallback.py
      - name: Commit system fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/admin-system.functions.ts
          git commit -m "fix: keep admin system usable without server secret"
          git push origin HEAD:fix/full-system-stability-integrations
