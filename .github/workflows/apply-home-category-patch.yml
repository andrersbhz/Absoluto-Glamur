name: Apply Home Category Patch

on:
  push:
    branches:
      - fix/home-categories-inline-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-categories-inline-builder
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/patch-home-categories-inline.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/_authenticated/admin.home.tsx src/components/admin/HomeBuilderPreview.tsx
          git commit -m "feat(home): add editable inline categories block"
          git push origin HEAD:fix/home-categories-inline-builder
